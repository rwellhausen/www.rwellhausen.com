<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
    <clipPath id="ballClip"><circle cx="260" cy="310" r="165"/></clipPath>
  </defs>

  <!-- round rocky ball -->
  <circle cx="260" cy="310" r="170" fill="#8d6a45" class="outline thick"/>

  <!-- mossy patches -->
  <g clip-path="url(#ballClip)">
    <path d="M 130 230 q 25 -35 70 -25 q 40 8 38 42 q -3 30 -45 28 q -40 -2 -55 -20 q -12 -14 -8 -25 Z" fill="#79c96b" class="outline mid"/>
    <path d="M 290 380 q 30 -22 68 -8 q 32 12 20 42 q -12 26 -50 20 q -36 -6 -44 -28 q -5 -16 6 -26 Z" fill="#79c96b" class="outline mid"/>
    <path d="M 150 400 q 18 -10 36 0 q 14 10 6 28 q -10 18 -32 12 q -22 -6 -20 -24 q 2 -12 10 -16 Z" fill="#79c96b" class="outline mid"/>
    <path d="M 300 170 q 20 -12 40 -2 q 16 10 8 28 q -10 18 -34 12 q -22 -6 -22 -22 q 0 -10 8 -16 Z" fill="#79c96b" class="outline mid"/>
  </g>

  <!-- pebbly speckles -->
  <g fill="#a98a63" stroke="none">
    <circle cx="215" cy="330" r="7"/><circle cx="330" cy="290" r="8"/><circle cx="260" cy="430" r="7"/>
  </g>

  <!-- shine -->
  <path d="M 165 205 q 30 -32 72 -36" fill="none" stroke="#c8a97e" stroke-width="12" stroke-linecap="round"/>

  <!-- dot eyes -->
  <circle cx="228" cy="290" r="13" fill="#2b2340"/>
  <circle cx="294" cy="290" r="13" fill="#2b2340"/>

  <!-- little sprout on top -->
  <path d="M 260 140 q -4 -30 -28 -38 M 260 140 q 6 -26 30 -32" fill="none" stroke="#3e8948" stroke-width="9" stroke-linecap="round"/>
</svg>
