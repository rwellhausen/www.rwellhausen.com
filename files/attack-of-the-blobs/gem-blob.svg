<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
  </defs>

  <!-- gem body: elongated diamond -->
  <path d="M 260 60 L 400 280 L 260 545 L 120 280 Z" fill="#5c7fd6" class="outline thick"/>
  <!-- facets -->
  <path d="M 260 60 L 200 280 L 260 545 M 260 60 L 320 280 L 260 545 M 120 280 L 200 280 M 320 280 L 400 280" fill="none" class="outline mid"/>
  <path d="M 200 280 L 320 280" fill="none" class="outline mid"/>
  <!-- light facet tints -->
  <path d="M 260 60 L 320 280 L 260 545 L 200 280 Z" fill="#89a8ea" stroke="none" opacity="0.55"/>
  <path d="M 260 60 L 200 280 L 120 280 Z" fill="#3f5cb0" stroke="none" opacity="0.45"/>
  <!-- shine -->
  <path d="M 228 130 q 14 -34 40 -44" fill="none" stroke="#dff2ff" stroke-width="11" stroke-linecap="round" opacity="0.9"/>

  <!-- dot eyes -->
  <circle cx="228" cy="250" r="13" fill="#2b2340"/>
  <circle cx="292" cy="250" r="13" fill="#2b2340"/>

  <!-- sparkle ticks -->
  <g fill="none" class="outline thin">
    <path d="M 90 140 l 0 -28 M 90 126 l -14 0 l 28 0"/>
    <path d="M 440 420 l 0 -24 M 440 408 l -12 0 l 24 0"/>
    <path d="M 425 120 q -14 12 -32 14"/>
  </g>
</svg>
