<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
  </defs>

  <!-- puffy round baby cloud: the usual baby blob but with cloud bumps -->
  <path d="M 260 152
           q 52 -18 86 18 q 48 -6 60 42 q 40 16 28 62 q 26 38 -6 70 q -2 46 -50 56 q -28 38 -76 24 q -46 20 -80 -14 q -50 4 -60 -46 q -40 -22 -24 -68 q -20 -44 18 -68 q 8 -44 56 -44 q 22 -30 48 -32 Z"
        fill="#ffffff" class="outline thick"/>

  <!-- soft shine -->
  <path d="M 172 222 q 24 -32 64 -40" fill="none" stroke="#dfe8f2" stroke-width="12" stroke-linecap="round"/>

  <!-- dot eyes -->
  <circle cx="225" cy="290" r="13" fill="#2b2340"/>
  <circle cx="295" cy="290" r="13" fill="#2b2340"/>

  <!-- one tiny raindrop it hasn't learned to hold in yet -->
  <path d="M 260 478 q -9 14 0 22 q 10 -8 0 -22 Z" fill="#8ecae6" class="outline thin"/>

  <!-- float lines -->
  <g fill="none" class="outline thin">
    <path d="M 92 190 q 14 -14 34 -16"/>
    <path d="M 430 400 q -12 14 -30 18"/>
  </g>
</svg>
