<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
    <path id="rayT" d="M 92 -11 L 232 0 L 92 11 Z"/>
    <path id="rayO" d="M 92 -10 L 198 0 L 92 10 Z"/>
  </defs>

  <!-- striped sparkler stick, held out the bottom-right of the burst -->
  <g transform="translate(240,230) rotate(52)">
    <rect x="70" y="-14" width="205" height="28" rx="12" fill="#3fb8af" class="outline mid"/>
    <path d="M 110 -14 l 0 28 M 150 -14 l 0 28 M 190 -14 l 0 28 M 230 -14 l 0 28" stroke="#f4913b" stroke-width="18"/>
    <rect x="70" y="-14" width="205" height="28" rx="12" fill="none" class="outline mid"/>
  </g>

  <!-- bursting rays: alternating teal and orange -->
  <g class="outline mid">
    <use href="#rayT" fill="#3fb8af" transform="translate(240,230) rotate(-90)"/>
    <use href="#rayO" fill="#f4913b" transform="translate(240,230) rotate(-60)"/>
    <use href="#rayT" fill="#3fb8af" transform="translate(240,230) rotate(-25)"/>
    <use href="#rayO" fill="#f4913b" transform="translate(240,230) rotate(8)"/>
    <use href="#rayT" fill="#3fb8af" transform="translate(240,230) rotate(95)"/>
    <use href="#rayO" fill="#f4913b" transform="translate(240,230) rotate(125)"/>
    <use href="#rayT" fill="#3fb8af" transform="translate(240,230) rotate(155)"/>
    <use href="#rayO" fill="#f4913b" transform="translate(240,230) rotate(-170)"/>
    <use href="#rayT" fill="#3fb8af" transform="translate(240,230) rotate(-135)"/>
    <use href="#rayO" fill="#f4913b" transform="translate(240,230) rotate(-115)"/>
  </g>

  <!-- thin crackle sparks between the rays -->
  <g fill="none" class="outline thin">
    <path d="M 240 230 m 120 -85 l 30 -22 M 240 230 m -125 -75 l -32 -20 M 240 230 m -130 65 l -34 18 M 240 230 m 55 135 l 12 36 M 240 230 m -40 138 l -10 36 M 240 230 m 142 30 l 38 8"/>
  </g>

  <!-- spark dots at the tips -->
  <g stroke="none">
    <circle cx="240" cy="-35" r="0"/>
    <circle cx="404" cy="90" r="9" fill="#f4913b"/>
    <circle cx="72" cy="112" r="9" fill="#3fb8af"/>
    <circle cx="52" cy="330" r="8" fill="#f4913b"/>
    <circle cx="318" cy="428" r="8" fill="#3fb8af"/>
    <circle cx="240" cy="52" r="9" fill="#f4913b"/>
  </g>

  <!-- glowing core -->
  <circle cx="240" cy="230" r="82" fill="#3fb8af" class="outline thick"/>
  <circle cx="240" cy="230" r="52" fill="#fff6e0" class="outline mid"/>

  <!-- dot eyes -->
  <circle cx="222" cy="225" r="11" fill="#2b2340"/>
  <circle cx="258" cy="225" r="11" fill="#2b2340"/>
</svg>
