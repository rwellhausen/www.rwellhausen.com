<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
    <clipPath id="triClip"><path d="M 130 165 L 390 165 L 260 470 Z"/></clipPath>
  </defs>

  <!-- little triangle: a young wind funnel -->
  <path d="M 130 165 L 390 165 L 260 470 Z" fill="#5fb2e6" class="outline thick"/>

  <!-- one small cloud starting to form -->
  <g clip-path="url(#triClip)">
    <path d="M 215 260 q 7 -18 26 -15 q 9 -13 25 -8 q 14 4 15 17 q 14 3 12 16 q -2 13 -18 13 l -46 0 q -16 -3 -14 -23 Z" fill="#ffffff" class="outline mid"/>
    <path d="M 175 340 q 40 12 80 6" fill="none" stroke="#bfe2f7" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- dot eyes -->
  <circle cx="230" cy="212" r="13" fill="#2b2340"/>
  <circle cx="292" cy="212" r="13" fill="#2b2340"/>

  <!-- motion lines -->
  <g fill="none" class="outline thin">
    <path d="M 85 210 q 18 -12 40 -10"/>
    <path d="M 435 260 q -14 14 -34 16"/>
    <path d="M 330 430 q 16 -4 26 -16"/>
  </g>
</svg>
