<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
  </defs>

  <!-- five-point dark star -->
  <path d="M 260 90 L 312 235 L 465 240 L 343 331 L 388 478 L 260 390 L 132 478 L 177 331 L 55 240 L 208 235 Z" fill="#453a5e" class="outline thick"/>

  <!-- purple glow edge -->
  <path d="M 205 175 q 22 -34 55 -42" fill="none" stroke="#6d5f8f" stroke-width="11" stroke-linecap="round"/>

  <!-- dot eyes -->
  <circle cx="228" cy="285" r="13" fill="#b9a1ea"/>
  <circle cx="292" cy="285" r="13" fill="#b9a1ea"/>

  <!-- night sparkles -->
  <g fill="none" class="outline thin">
    <path d="M 90 130 l 0 -26 M 90 117 l -13 0 l 26 0"/>
    <path d="M 448 140 l 0 -22 M 448 129 l -11 0 l 22 0"/>
    <path d="M 460 430 l 0 -24 M 460 418 l -12 0 l 24 0"/>
  </g>
</svg>
