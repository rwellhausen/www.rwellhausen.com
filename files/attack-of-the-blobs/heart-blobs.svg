<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
    <g id="heart">
      <path d="M 0 55 C -60 5 -78 -45 -42 -68 C -18 -82 0 -62 0 -45 C 0 -62 18 -82 42 -68 C 78 -45 60 5 0 55 Z" fill="#e26fa0" class="outline thick"/>
      <path d="M -38 -50 q 12 -14 28 -12" fill="none" stroke="#f3a6c8" stroke-width="9" stroke-linecap="round"/>
      <circle cx="-16" cy="-25" r="9" fill="#2b2340" stroke="none"/>
      <circle cx="16" cy="-25" r="9" fill="#2b2340" stroke="none"/>
    </g>
  </defs>

  <!-- trio: one on top, two below (like the sketch) -->
  <use href="#heart" transform="translate(260,170) scale(1.15)"/>
  <use href="#heart" transform="translate(165,375) scale(1.15) rotate(-8)"/>
  <use href="#heart" transform="translate(355,375) scale(1.15) rotate(8)"/>

  <!-- floating sparkles -->
  <g fill="none" class="outline thin">
    <path d="M 80 130 l 0 -26 M 80 117 l -13 0 l 26 0"/>
    <path d="M 445 200 l 0 -24 M 445 188 l -12 0 l 24 0"/>
    <path d="M 260 510 l 0 -22 M 260 499 l -11 0 l 22 0"/>
  </g>
</svg>
