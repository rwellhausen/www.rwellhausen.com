<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
    <path id="heartShape" d="M 0 55 C -60 5 -78 -45 -42 -68 C -18 -82 0 -62 0 -45 C 0 -62 18 -82 42 -68 C 78 -45 60 5 0 55 Z"/>
  </defs>

  <!-- trio touching, like the sketch: one on top leaning on the two below -->

  <!-- SAD (bottom left) -->
  <g transform="translate(172,368) scale(1.3) rotate(-6)">
    <use href="#heartShape" fill="#e26fa0" class="outline thick"/>
    <path d="M -38 -50 q 12 -14 28 -12" fill="none" stroke="#f3a6c8" stroke-width="9" stroke-linecap="round"/>
    <circle cx="-16" cy="-28" r="9" fill="#2b2340" stroke="none"/>
    <circle cx="16" cy="-28" r="9" fill="#2b2340" stroke="none"/>
    <path d="M -14 6 q 14 -12 28 0" fill="none" class="outline mid"/>
    <!-- teardrop -->
    <path d="M -28 -12 q -8 12 0 18 q 9 -6 0 -18 Z" fill="#8ecae6" class="outline thin"/>
  </g>

  <!-- MAD (bottom right) -->
  <g transform="translate(348,368) scale(1.3) rotate(6)">
    <use href="#heartShape" fill="#e26fa0" class="outline thick"/>
    <path d="M -38 -50 q 12 -14 28 -12" fill="none" stroke="#f3a6c8" stroke-width="9" stroke-linecap="round"/>
    <!-- angry brows -->
    <path d="M -28 -44 l 22 8 M 28 -44 l -22 8" fill="none" class="outline mid"/>
    <circle cx="-15" cy="-26" r="9" fill="#2b2340" stroke="none"/>
    <circle cx="15" cy="-26" r="9" fill="#2b2340" stroke="none"/>
    <path d="M -13 10 q 13 -10 26 0" fill="none" class="outline mid"/>
    <!-- steam tick -->
    <path d="M 52 -78 q 8 -8 4 -18" fill="none" class="outline thin"/>
  </g>

  <!-- HAPPY (top, resting on the other two) -->
  <g transform="translate(260,205) scale(1.3)">
    <use href="#heartShape" fill="#e26fa0" class="outline thick"/>
    <path d="M -38 -50 q 12 -14 28 -12" fill="none" stroke="#f3a6c8" stroke-width="9" stroke-linecap="round"/>
    <circle cx="-16" cy="-28" r="9" fill="#2b2340" stroke="none"/>
    <circle cx="16" cy="-28" r="9" fill="#2b2340" stroke="none"/>
    <path d="M -16 -2 q 16 16 32 0" fill="none" class="outline mid"/>
  </g>

  <!-- floating sparkles -->
  <g fill="none" class="outline thin">
    <path d="M 80 150 l 0 -26 M 80 137 l -13 0 l 26 0"/>
    <path d="M 445 190 l 0 -24 M 445 178 l -12 0 l 24 0"/>
    <path d="M 260 530 l 0 -22 M 260 519 l -11 0 l 22 0"/>
  </g>
</svg>
