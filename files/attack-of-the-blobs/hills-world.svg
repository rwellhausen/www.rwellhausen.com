<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="760" height="480" rx="26" fill="#e8f4fd"/>

  <!-- sunny halos behind the hilltops, like the yellow crayon edges -->
  <g fill="none" stroke="#ffe94d" stroke-width="24" stroke-linecap="round">
    <path d="M 240 420 A 185 225 0 0 1 605 420"/>
    <path d="M 50 425 A 195 205 0 0 1 435 425"/>
    <path d="M 390 425 A 180 190 0 0 1 745 425"/>
  </g>

  <!-- back hill (center, tallest) -->
  <path d="M 240 430 A 185 225 0 0 1 605 430 Z" fill="#74bf6b" class="outline thick"/>
  <path d="M 340 250 q 55 -18 110 0 M 320 320 q 70 20 145 6" fill="none" stroke="#9ad48f" stroke-width="10" stroke-linecap="round"/>

  <!-- left hill -->
  <path d="M 50 430 A 195 205 0 0 1 435 430 Z" fill="#74bf6b" class="outline thick"/>
  <path d="M 130 320 q 60 -20 120 -4 M 110 380 q 80 22 170 8" fill="none" stroke="#9ad48f" stroke-width="10" stroke-linecap="round"/>

  <!-- right hill -->
  <path d="M 390 430 A 180 190 0 0 1 745 430 Z" fill="#74bf6b" class="outline thick"/>
  <path d="M 480 330 q 55 -18 110 -2 M 470 390 q 70 20 150 6" fill="none" stroke="#9ad48f" stroke-width="10" stroke-linecap="round"/>

  <!-- ground -->
  <path d="M 20 430 L 740 430" fill="none" class="outline thick"/>
  <rect x="20" y="430" width="720" height="30" rx="12" fill="#4f9a51" class="outline mid"/>

  <!-- a couple of drifting puffs in the sky -->
  <g fill="#ffffff" class="outline mid">
    <path d="M 110 105 q 6 -20 28 -17 q 9 -13 26 -8 q 15 4 16 18 q 15 3 12 16 q -2 13 -19 13 l -48 0 q -16 -3 -15 -22 Z"/>
    <path d="M 600 85 q 5 -17 24 -14 q 8 -11 22 -7 q 13 4 14 15 q 12 3 10 14 q -2 11 -16 11 l -41 0 q -14 -2 -13 -19 Z"/>
  </g>
</svg>
