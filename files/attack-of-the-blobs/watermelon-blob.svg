<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
  </defs>

  <!-- juicy red flesh block with a wobbly top -->
  <path d="M 95 190 q 40 -30 85 -12 q 40 -28 80 -8 q 45 -22 78 6 q 32 -8 42 22 l 0 262 L 95 460 Z" fill="#e63946" class="outline thick"/>
  <!-- bite sparkle -->
  <path d="M 135 215 q 30 -18 62 -14" fill="none" stroke="#ff7b86" stroke-width="11" stroke-linecap="round"/>

  <!-- seeds -->
  <g fill="#2b2340" stroke="none">
    <ellipse cx="165" cy="330" rx="9" ry="13" transform="rotate(-15 165 330)"/>
    <ellipse cx="260" cy="380" rx="9" ry="13" transform="rotate(12 260 380)"/>
    <ellipse cx="345" cy="320" rx="9" ry="13" transform="rotate(-8 345 320)"/>
    <ellipse cx="300" cy="240" rx="8" ry="12" transform="rotate(18 300 240)"/>
  </g>

  <!-- rind: white then green stripe at the bottom -->
  <rect x="95" y="440" width="285" height="34" fill="#fff6e0" class="outline mid"/>
  <rect x="95" y="470" width="285" height="46" rx="12" fill="#3e8948" class="outline thick"/>
  <path d="M 130 493 l 40 0 M 210 493 l 40 0 M 290 493 l 40 0" fill="none" stroke="#2c6b34" stroke-width="8" stroke-linecap="round"/>

  <!-- dot eyes -->
  <circle cx="205" cy="270" r="13" fill="#2b2340"/>
  <circle cx="275" cy="270" r="13" fill="#2b2340"/>

  <!-- juice drips -->
  <g fill="none" class="outline thin">
    <path d="M 435 250 q 10 14 4 30"/>
    <path d="M 60 300 q -8 12 -4 26"/>
  </g>
</svg>
