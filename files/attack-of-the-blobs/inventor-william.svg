<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
  </defs>

  <!-- body: blue t-shirt -->
  <path d="M 150 470 q 0 -75 45 -95 l 130 0 q 45 20 45 95 l 0 60 l -220 0 Z" fill="#2f7fd0" class="outline thick"/>
  <path d="M 218 378 q 42 22 84 0" fill="none" class="outline mid"/>
  <!-- little collar shine -->
  <path d="M 175 430 q 4 -28 22 -42" fill="none" stroke="#6fa9e0" stroke-width="10" stroke-linecap="round"/>

  <!-- arm holding a red crayon -->
  <path d="M 355 470 q 45 -12 60 -55" fill="none" stroke="#2f7fd0" stroke-width="34" stroke-linecap="round"/>
  <circle cx="420" cy="408" r="20" fill="#ffd9b3" class="outline mid"/>
  <g transform="translate(432,352) rotate(20)">
    <rect x="-12" y="0" width="24" height="66" rx="8" fill="#e63946" class="outline mid"/>
    <path d="M -12 0 L 0 -26 L 12 0 Z" fill="#e63946" class="outline mid"/>
  </g>

  <!-- head -->
  <circle cx="260" cy="235" r="125" fill="#ffd9b3" class="outline thick"/>

  <!-- sandy hair: short with a little fringe -->
  <path d="M 137 218 q -4 -70 60 -98 q 62 -28 122 2 q 62 30 64 96 q -30 -32 -56 -28 q 8 -18 -8 -30 q -6 16 -26 20 q 4 -20 -12 -32 q -10 18 -34 22 q -30 4 -52 20 q -22 14 -28 34 q -18 -14 -30 -6 Z" fill="#c9a05e" class="outline thick"/>

  <!-- ears -->
  <circle cx="132" cy="245" r="18" fill="#ffd9b3" class="outline mid"/>
  <circle cx="388" cy="245" r="18" fill="#ffd9b3" class="outline mid"/>

  <!-- dot eyes, just like his blobs -->
  <circle cx="220" cy="240" r="13" fill="#2b2340"/>
  <circle cx="300" cy="240" r="13" fill="#2b2340"/>

  <!-- freckles -->
  <g fill="#e0a878" stroke="none">
    <circle cx="185" cy="275" r="4"/><circle cx="200" cy="285" r="4"/><circle cx="335" cy="275" r="4"/><circle cx="320" cy="285" r="4"/>
  </g>

  <!-- big happy grin with teeth -->
  <path d="M 205 295 q 55 52 110 0 q -12 40 -55 40 q -43 0 -55 -40 Z" fill="#ffffff" class="outline mid"/>

  <!-- sparkles: inventing energy -->
  <g fill="none" class="outline thin">
    <path d="M 85 130 l 0 -28 M 85 116 l -14 0 l 28 0"/>
    <path d="M 452 120 l 0 -24 M 452 108 l -12 0 l 24 0"/>
    <path d="M 70 350 q -12 10 -14 26"/>
  </g>
</svg>
