<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
  </defs>

  <!-- big curling wave -->
  <path d="M 70 520 Q 40 300 130 170 Q 220 50 360 95 Q 450 125 460 200 Q 400 150 330 165 Q 385 190 400 250 Q 340 205 275 230 Q 320 270 315 330 Q 265 280 215 310 Q 240 380 210 520 Z" fill="#3fa7d6" class="outline thick"/>

  <!-- inner water swirl -->
  <path d="M 120 480 Q 105 320 165 220" fill="none" stroke="#8ecae6" stroke-width="14" stroke-linecap="round"/>
  <path d="M 175 460 Q 168 360 200 300" fill="none" stroke="#8ecae6" stroke-width="10" stroke-linecap="round"/>

  <!-- foam bubbles on the crest -->
  <g fill="#fff6e0" class="outline mid">
    <circle cx="360" cy="110" r="18"/>
    <circle cx="410" cy="150" r="14"/>
    <circle cx="300" cy="180" r="13"/>
    <circle cx="330" cy="255" r="12"/>
  </g>

  <!-- dot eyes -->
  <circle cx="155" cy="270" r="13" fill="#2b2340"/>
  <circle cx="215" cy="255" r="13" fill="#2b2340"/>

  <!-- splash droplets -->
  <g fill="none" class="outline thin">
    <path d="M 470 90 q 8 12 4 26"/>
    <path d="M 495 160 q 6 10 2 22"/>
    <path d="M 60 200 q -8 12 -4 26"/>
  </g>
</svg>
