<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
  </defs>

  <!-- flying lava bombs -->
  <path d="M 118 105 q -14 22 2 34 q 18 -8 10 -30 q -4 -10 -12 -4 Z" fill="#e63946" class="outline thin"/>
  <path d="M 395 75 q -14 22 2 34 q 18 -8 10 -30 q -4 -10 -12 -4 Z" fill="#e63946" class="outline thin"/>
  <path d="M 300 35 q -10 16 2 26 q 14 -6 8 -22 q -3 -8 -10 -4 Z" fill="#f4913b" class="outline thin"/>

  <!-- scary jagged lava eruption -->
  <path d="M 185 180 L 128 80 L 196 112 L 212 25 L 250 105 L 288 20 L 306 108 L 372 55 L 350 125 L 408 118 L 335 180 Z" fill="#e63946" class="outline thick"/>
  <!-- inner hot flame -->
  <path d="M 216 176 L 200 110 L 244 140 L 262 70 L 286 138 L 320 112 L 304 176 Z" fill="#ffb703" class="outline mid"/>

  <!-- mountain -->
  <path d="M 195 165 L 325 165 L 455 540 L 65 540 Z" fill="#a97c50" class="outline thick"/>

  <!-- lava spilling down both slopes -->
  <path d="M 196 172 q -14 40 4 62 q 14 18 2 40 M 326 172 q 16 38 2 64 q -10 20 4 38" fill="none" stroke="#e63946" stroke-width="16" stroke-linecap="round"/>
  <!-- crater rim -->
  <path d="M 195 165 q 65 22 130 0" fill="none" class="outline mid"/>
  <!-- rocky speckles -->
  <g fill="#c8a06e" stroke="none">
    <circle cx="200" cy="300" r="8"/><circle cx="330" cy="340" r="7"/><circle cx="150" cy="440" r="8"/>
    <circle cx="280" cy="470" r="7"/><circle cx="380" cy="480" r="8"/><circle cx="245" cy="245" r="6"/>
  </g>

  <!-- dot eyes -->
  <circle cx="225" cy="330" r="13" fill="#2b2340"/>
  <circle cx="295" cy="330" r="13" fill="#2b2340"/>

  <!-- rumble lines -->
  <g fill="none" class="outline thin">
    <path d="M 55 250 q 16 -12 38 -10"/>
    <path d="M 470 300 q -14 14 -34 16"/>
    <path d="M 85 560 q 16 -8 36 -6 M 400 560 q 16 -8 36 -6"/>
  </g>
</svg>
