<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
  </defs>

  <!-- baby blob: simple wobbly circle -->
  <path d="M 260 148 q 118 -14 148 96 q 26 96 -56 150 q -94 58 -178 4 q -80 -54 -54 -148 q 26 -96 140 -102 Z" fill="#e26fa0" class="outline thick"/>

  <!-- shine -->
  <path d="M 168 218 q 26 -34 68 -42" fill="none" stroke="#f3a6c8" stroke-width="12" stroke-linecap="round"/>

  <!-- dot eyes -->
  <circle cx="225" cy="290" r="13" fill="#2b2340"/>
  <circle cx="295" cy="290" r="13" fill="#2b2340"/>

  <!-- bounce lines -->
  <g fill="none" class="outline thin">
    <path d="M 92 190 q 14 -14 34 -16"/>
    <path d="M 430 400 q -12 14 -30 18"/>
  </g>
</svg>
