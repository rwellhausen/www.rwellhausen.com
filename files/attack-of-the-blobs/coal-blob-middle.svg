<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
  </defs>

  <!-- big chunky coal lump -->
  <path d="M 175 145 L 290 115 L 390 185 L 425 300 L 380 420 L 270 470 L 155 430 L 105 320 L 125 210 Z" fill="#3d3d4a" class="outline thick"/>
  <!-- facet cracks -->
  <path d="M 290 115 L 265 250 L 425 300 M 265 250 L 155 430 M 265 250 L 105 320" fill="none" stroke="#2b2340" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- sparkly specks like the drawing -->
  <g fill="#fff6e0" stroke="none">
    <circle cx="200" cy="200" r="8"/><circle cx="340" cy="220" r="7"/><circle cx="180" cy="350" r="7"/>
    <circle cx="330" cy="380" r="8"/><circle cx="255" cy="160" r="5"/><circle cx="390" cy="300" r="5"/>
  </g>
  <g fill="#6a6a78" stroke="none">
    <circle cx="235" cy="320" r="9"/><circle cx="300" cy="300" r="6"/><circle cx="150" cy="270" r="6"/>
  </g>

  <!-- pale dot eyes so they show on the coal -->
  <circle cx="228" cy="270" r="13" fill="#fff6e0"/>
  <circle cx="294" cy="270" r="13" fill="#fff6e0"/>

  <!-- dusty ticks -->
  <g fill="none" class="outline thin">
    <path d="M 80 170 q 14 -12 34 -14"/>
    <path d="M 455 400 q -12 12 -30 16"/>
    <path d="M 250 530 q 14 8 32 6"/>
  </g>
</svg>
