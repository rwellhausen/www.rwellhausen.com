<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
  </defs>

  <!-- stepped pyramid of bricks, bottom to top -->
  <!-- tier 5 (bottom) -->
  <rect x="55" y="465" width="410" height="85" rx="10" fill="#c98a4b" class="outline thick"/>
  <path d="M 160 465 L 160 550 M 265 465 L 265 550 M 370 465 L 370 550" fill="none" class="outline mid"/>
  <!-- tier 4 -->
  <rect x="85" y="380" width="350" height="85" rx="10" fill="#c98a4b" class="outline thick"/>
  <path d="M 210 380 L 210 465 M 320 380 L 320 465" fill="none" class="outline mid"/>
  <!-- tier 3 -->
  <rect x="118" y="295" width="284" height="85" rx="10" fill="#c98a4b" class="outline thick"/>
  <path d="M 175 295 L 175 380 M 260 295 L 260 380 M 345 295 L 345 380" fill="none" class="outline mid"/>
  <!-- tier 2 -->
  <rect x="152" y="210" width="216" height="85" rx="10" fill="#c98a4b" class="outline thick"/>
  <path d="M 260 210 L 260 295" fill="none" class="outline mid"/>
  <!-- tier 1 (top block) -->
  <rect x="205" y="125" width="110" height="85" rx="10" fill="#c98a4b" class="outline thick"/>

  <!-- brick speckle texture -->
  <g fill="#e8b06e" stroke="none">
    <circle cx="110" cy="505" r="7"/><circle cx="215" cy="520" r="6"/><circle cx="330" cy="495" r="7"/><circle cx="420" cy="515" r="6"/>
    <circle cx="140" cy="420" r="6"/><circle cx="265" cy="435" r="7"/><circle cx="385" cy="410" r="6"/>
    <circle cx="150" cy="340" r="6"/><circle cx="310" cy="330" r="7"/><circle cx="370" cy="355" r="5"/>
    <circle cx="195" cy="255" r="6"/><circle cx="330" cy="250" r="6"/>
    <circle cx="240" cy="160" r="6"/><circle cx="285" cy="185" r="5"/>
  </g>

  <!-- dot eyes -->
  <circle cx="212" cy="248" r="13" fill="#2b2340"/>
  <circle cx="308" cy="248" r="13" fill="#2b2340"/>

  <!-- little rumble lines -->
  <g fill="none" class="outline thin">
    <path d="M 40 200 q 18 -12 40 -10"/>
    <path d="M 478 260 q -14 14 -34 16"/>
    <path d="M 60 320 q 12 10 30 10"/>
    <path d="M 452 430 q 16 -6 26 -18"/>
  </g>
</svg>
