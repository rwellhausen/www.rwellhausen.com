<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
  </defs>

  <!-- bottom ingot -->
  <g transform="translate(260,485)">
    <path d="M -155 -50 L 155 -50 L 185 50 L -185 50 Z" fill="#ffd166" class="outline thick"/>
    <g fill="#ffe9b0" stroke="none"><circle cx="-90" cy="5" r="7"/><circle cx="60" cy="15" r="6"/><circle cx="140" cy="0" r="6"/></g>
  </g>

  <!-- middle ingot -->
  <g transform="translate(260,385)">
    <path d="M -125 -50 L 125 -50 L 150 50 L -150 50 Z" fill="#ffd166" class="outline thick"/>
    <path d="M -125 -50 L 125 -50 L 112 -78 L -112 -78 Z" fill="#ffe29a" class="outline mid"/>
    <!-- little peeking eyes -->
    <circle cx="55" cy="0" r="10" fill="#2b2340"/>
    <circle cx="100" cy="0" r="10" fill="#2b2340"/>
    <path d="M -105 -15 q 45 -14 95 -8" fill="none" stroke="#fff6e0" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- top ingot with the king's face -->
  <g transform="translate(260,255)">
    <path d="M -100 -50 L 100 -50 L 122 52 L -122 52 Z" fill="#ffd166" class="outline thick"/>
    <path d="M -100 -50 L 100 -50 L 88 -78 L -88 -78 Z" fill="#ffe29a" class="outline mid"/>
    <circle cx="-35" cy="-5" r="13" fill="#2b2340"/>
    <circle cx="35" cy="-5" r="13" fill="#2b2340"/>
    <path d="M -18 25 q 18 15 36 0" fill="none" class="outline mid"/>
    <!-- crown -->
    <path d="M -68 -78 L -68 -150 L -34 -112 L 0 -162 L 34 -112 L 68 -150 L 68 -78 Z" fill="#ffe29a" class="outline thick"/>
    <circle cx="0" cy="-170" r="9" fill="#e63946" class="outline thin"/>
  </g>

  <!-- royal sparkles -->
  <g fill="none" class="outline thin">
    <path d="M 90 130 l 0 -28 M 90 116 l -14 0 l 28 0"/>
    <path d="M 435 170 l 0 -24 M 435 158 l -12 0 l 24 0"/>
    <path d="M 60 340 q -12 10 -14 26"/>
    <path d="M 462 350 q 12 10 14 26"/>
  </g>
</svg>
