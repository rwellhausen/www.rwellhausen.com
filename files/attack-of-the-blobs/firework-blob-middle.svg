<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
    <clipPath id="rocketClip"><rect x="185" y="200" width="150" height="260" rx="18"/></clipPath>
  </defs>

  <!-- nose cone: one triangle, pointing up -->
  <path d="M 260 70 L 350 210 L 170 210 Z" fill="#3fb8af" class="outline thick"/>

  <!-- rocket body: gold with teal diagonal stripes -->
  <rect x="185" y="200" width="150" height="260" rx="18" fill="#ffd166" class="outline thick"/>
  <g clip-path="url(#rocketClip)" stroke="#3fb8af" stroke-width="22" fill="none">
    <path d="M 160 265 L 360 205 M 160 335 L 360 275 M 160 405 L 360 345 M 160 475 L 360 415"/>
  </g>
  <rect x="185" y="200" width="150" height="260" rx="18" fill="none" class="outline thick"/>

  <!-- dot eyes on the body -->
  <circle cx="230" cy="390" r="13" fill="#2b2340"/>
  <circle cx="290" cy="390" r="13" fill="#2b2340"/>

  <!-- fuse at the bottom, lit and sparking -->
  <path d="M 260 462 q 10 45 60 55" fill="none" stroke="#6b6b7a" stroke-width="12" stroke-linecap="round"/>
  <g stroke="#f4913b" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M 340 525 l 24 8 M 332 540 l 16 20 M 342 508 l 22 -12 M 318 542 l 2 26"/>
  </g>
  <circle cx="328" cy="522" r="11" fill="#f4913b" class="outline thin"/>

  <!-- ready-to-launch ticks -->
  <g fill="none" class="outline thin">
    <path d="M 120 170 q 14 -12 34 -12"/>
    <path d="M 425 240 q -12 12 -30 14"/>
    <path d="M 110 420 q -12 10 -14 26"/>
  </g>
</svg>
