<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
  </defs>

  <!-- three yellow beams shining down -->
  <path d="M 218 205 L 122 490 L 205 490 L 246 210 Z" fill="#ffe94d" class="outline mid"/>
  <path d="M 246 212 L 232 505 L 292 505 L 276 212 Z" fill="#ffe94d" class="outline mid"/>
  <path d="M 276 210 L 318 490 L 400 490 L 304 205 Z" fill="#ffe94d" class="outline mid"/>
  <!-- inner glow stripes -->
  <path d="M 228 230 L 175 470 M 261 235 L 261 485 M 294 230 L 348 470" fill="none" stroke="#fff6b0" stroke-width="12" stroke-linecap="round"/>

  <!-- dark fuzzy lamp blob on top -->
  <path d="M 260 90 q 55 -4 76 40 q 18 38 -8 68 q -26 30 -68 30 q -42 0 -68 -30 q -26 -30 -8 -68 q 21 -44 76 -40 Z" fill="#3d3d4a" class="outline thick"/>
  <!-- fuzzy scribble edge -->
  <path d="M 190 110 q -14 6 -20 20 M 330 110 q 14 6 20 20 M 205 205 q -10 12 -6 24 M 315 205 q 10 12 6 24" fill="none" stroke="#3d3d4a" stroke-width="12" stroke-linecap="round"/>

  <!-- pale dot eyes on the lamp -->
  <circle cx="228" cy="160" r="13" fill="#fff6e0"/>
  <circle cx="292" cy="160" r="13" fill="#fff6e0"/>

  <!-- sparkle ticks -->
  <g fill="none" class="outline thin">
    <path d="M 105 130 l 0 -28 M 105 116 l -14 0 l 28 0"/>
    <path d="M 425 150 l 0 -24 M 425 138 l -12 0 l 24 0"/>
    <path d="M 85 400 q -12 10 -14 26"/>
    <path d="M 445 400 q 12 10 14 26"/>
  </g>
</svg>
