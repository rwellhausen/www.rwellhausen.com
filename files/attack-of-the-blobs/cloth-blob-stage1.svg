<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
    <clipPath id="patClip"><circle cx="260" cy="300" r="160"/></clipPath>
  </defs>

  <!-- round blob base -->
  <circle cx="260" cy="300" r="165" fill="#d9a441" class="outline thick"/>

  <!-- a bunch of patterns -->
  <g clip-path="url(#patClip)">
    <!-- plaid: green verticals + red horizontals -->
    <rect x="140" y="120" width="18" height="200" fill="#3e8948"/>
    <rect x="215" y="110" width="18" height="210" fill="#3e8948"/>
    <rect x="295" y="110" width="18" height="210" fill="#3e8948"/>
    <rect x="370" y="120" width="18" height="200" fill="#3e8948"/>
    <rect x="90" y="180" width="340" height="16" fill="#e63946"/>
    <rect x="90" y="240" width="340" height="16" fill="#e63946"/>
    <!-- divider -->
    <path d="M 95 330 L 425 330" fill="none" class="outline mid"/>
    <!-- zigzags -->
    <path d="M 95 385 L 135 355 L 175 385 L 215 355 L 255 385 L 295 355 L 335 385 L 375 355 L 415 385" fill="none" stroke="#e63946" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 95 440 L 135 410 L 175 440 L 215 410 L 255 440 L 295 410 L 335 440 L 375 410 L 415 440" fill="none" stroke="#3e8948" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- eyes on white patches so they show over the patterns -->
  <circle cx="225" cy="290" r="20" fill="#fff6e0" class="outline thin"/>
  <circle cx="295" cy="290" r="20" fill="#fff6e0" class="outline thin"/>
  <circle cx="225" cy="290" r="11" fill="#2b2340"/>
  <circle cx="295" cy="290" r="11" fill="#2b2340"/>

  <!-- bounce lines -->
  <g fill="none" class="outline thin">
    <path d="M 85 175 q 14 -14 34 -16"/>
    <path d="M 440 410 q -12 14 -30 18"/>
  </g>
</svg>
