<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
  </defs>

  <!-- short wooden stick -->
  <path d="M 236 400 L 284 400 L 280 545 L 240 545 Z" fill="#e8b06e" class="outline thick"/>
  <path d="M 256 425 l -2 95" fill="none" stroke="#c98a4b" stroke-width="8" stroke-linecap="round"/>

  <!-- big round blobby match head (same wobbly blob as the other babies) -->
  <path d="M 260 118 q 118 -14 148 96 q 26 96 -56 150 q -94 58 -178 4 q -80 -54 -54 -148 q 26 -96 140 -102 Z" fill="#e63946" class="outline thick"/>

  <!-- burnt smudge on top -->
  <path d="M 208 138 q 24 -26 58 -18 q 26 6 30 30 q -32 18 -62 8 q -20 -6 -26 -20 Z" fill="#5a3040" class="outline mid"/>

  <!-- shine -->
  <path d="M 168 188 q 26 -34 68 -42" fill="none" stroke="#ff7b86" stroke-width="12" stroke-linecap="round"/>

  <!-- dot eyes -->
  <circle cx="225" cy="260" r="13" fill="#2b2340"/>
  <circle cx="295" cy="260" r="13" fill="#2b2340"/>

  <!-- bounce lines -->
  <g fill="none" class="outline thin">
    <path d="M 92 160 q 14 -14 34 -16"/>
    <path d="M 430 370 q -12 14 -30 18"/>
  </g>
</svg>
