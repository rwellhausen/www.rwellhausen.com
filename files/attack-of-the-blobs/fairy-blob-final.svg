<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
    <!-- one pair of wings, mirrored for the other side -->
    <g id="wingsR">
      <path d="M 55 -15 Q 175 -125 205 -40 Q 220 35 70 42 Z" fill="#f3a6c8" class="outline mid"/>
      <path d="M 58 42 Q 175 55 158 130 Q 138 190 52 88 Z" fill="#f3a6c8" class="outline mid"/>
      <circle cx="150" cy="-42" r="14" fill="#d9558f" stroke="none"/>
      <circle cx="128" cy="105" r="10" fill="#d9558f" stroke="none"/>
    </g>
  </defs>

  <g transform="translate(260,225)">
    <!-- four butterfly wings -->
    <use href="#wingsR"/>
    <use href="#wingsR" transform="scale(-1,1)"/>

    <!-- wand handle, straight down and connected -->
    <rect x="-25" y="45" width="50" height="295" rx="22" fill="#d1935a" class="outline thick"/>
    <path d="M -7 150 q 9 80 0 165" fill="none" stroke="#e8b98a" stroke-width="10" stroke-linecap="round"/>

    <!-- big star head -->
    <g transform="scale(1.18)">
      <path d="M 0 -140 L 34 -47 L 133 -43 L 55 18 L 82 113 L 0 58 L -82 113 L -55 18 L -133 -43 L -34 -47 Z" fill="#d9558f" class="outline thick" stroke-width="8.5"/>
      <path d="M -52 -68 q 20 -22 50 -24" fill="none" stroke="#eb8ab5" stroke-width="9" stroke-linecap="round"/>
      <circle cx="-24" cy="-10" r="12" fill="#2b2340"/>
      <circle cx="26" cy="-10" r="12" fill="#2b2340"/>
    </g>
  </g>

  <!-- extra magic sparkles for the final form -->
  <g fill="none" class="outline thin">
    <path d="M 70 90 l 0 -28 M 70 76 l -14 0 l 28 0"/>
    <path d="M 455 100 l 0 -26 M 455 87 l -13 0 l 26 0"/>
    <path d="M 90 470 l 0 -24 M 90 458 l -12 0 l 24 0"/>
    <path d="M 435 480 l 0 -26 M 435 467 l -13 0 l 26 0"/>
  </g>
  <g fill="#eb8ab5" stroke="none">
    <circle cx="140" cy="60" r="7"/><circle cx="400" cy="55" r="6"/><circle cx="460" cy="300" r="6"/><circle cx="60" cy="300" r="6"/>
  </g>
</svg>
