<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
  </defs>

  <!-- fat crescent moon, opening to the right -->
  <path d="M 320 70 A 235 235 0 1 0 320 530 A 260 260 0 0 1 320 70 Z" fill="#9b7ede" class="outline thick"/>

  <!-- craters -->
  <g fill="#b9a1ea" class="outline mid">
    <circle cx="140" cy="145" r="20"/>
    <circle cx="75" cy="370" r="13"/>
    <circle cx="132" cy="442" r="18"/>
  </g>

  <!-- shine along the top edge -->
  <path d="M 195 98 q -55 16 -95 58" fill="none" stroke="#d6c6f5" stroke-width="12" stroke-linecap="round"/>

  <!-- dot eyes, side by side on the wide part of the crescent -->
  <circle cx="88" cy="262" r="13" fill="#2b2340"/>
  <circle cx="152" cy="272" r="13" fill="#2b2340"/>

  <!-- stars -->
  <g fill="none" class="outline thin">
    <path d="M 400 160 l 0 -28 M 400 146 l -14 0 l 28 0"/>
    <path d="M 440 320 l 0 -22 M 440 309 l -11 0 l 22 0"/>
    <path d="M 380 450 l 0 -24 M 380 438 l -12 0 l 24 0"/>
  </g>
</svg>
