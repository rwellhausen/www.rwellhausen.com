<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
  </defs>

  <!-- crescent moon, opening to the right like the sketch -->
  <path d="M 330 75 A 235 235 0 1 0 330 525 A 185 185 0 1 1 330 75 Z" fill="#9b7ede" class="outline thick"/>

  <!-- craters -->
  <g fill="#b9a1ea" class="outline mid">
    <circle cx="150" cy="200" r="22"/>
    <circle cx="115" cy="405" r="16"/>
    <circle cx="170" cy="440" r="19"/>
  </g>

  <!-- shine -->
  <path d="M 205 105 q -40 14 -66 48" fill="none" stroke="#d6c6f5" stroke-width="12" stroke-linecap="round"/>

  <!-- dot eyes -->
  <circle cx="86" cy="250" r="13" fill="#2b2340"/>
  <circle cx="97" cy="318" r="13" fill="#2b2340"/>

  <!-- stars -->
  <g fill="none" class="outline thin">
    <path d="M 400 160 l 0 -28 M 400 146 l -14 0 l 28 0"/>
    <path d="M 440 320 l 0 -22 M 440 309 l -11 0 l 22 0"/>
    <path d="M 380 450 l 0 -24 M 380 438 l -12 0 l 24 0"/>
  </g>
</svg>
