<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <style>
      .outline { stroke:#2b2340; stroke-linejoin:round; stroke-linecap:round; }
      .thick { stroke-width:10; }
      .mid { stroke-width:7; }
      .thin { stroke-width:5; }
    </style>
  </defs>

  <!-- tall pointed diamond -->
  <path d="M 260 80 L 385 430 L 135 430 Z" fill="#5c7fd6" class="outline thick"/>
  <!-- facet lines from the tip -->
  <path d="M 260 80 L 195 430 M 260 80 L 325 430" fill="none" class="outline mid"/>
  <!-- light and dark facets -->
  <path d="M 260 80 L 325 430 L 195 430 Z" fill="#89a8ea" stroke="none" opacity="0.5"/>
  <path d="M 260 80 L 135 430 L 195 430 Z" fill="#3f5cb0" stroke="none" opacity="0.4"/>

  <!-- faceted base band -->
  <path d="M 135 430 L 385 430 L 375 495 L 145 495 Z" fill="#5c7fd6" class="outline thick"/>
  <path d="M 175 430 L 195 495 M 240 430 L 250 495 M 305 430 L 295 495 M 355 430 L 340 495" fill="none" class="outline mid"/>

  <!-- shine -->
  <path d="M 232 150 q 10 -34 26 -50" fill="none" stroke="#dff2ff" stroke-width="11" stroke-linecap="round" opacity="0.9"/>

  <!-- dot eyes -->
  <circle cx="228" cy="330" r="13" fill="#2b2340"/>
  <circle cx="292" cy="330" r="13" fill="#2b2340"/>

  <!-- sparkle ticks -->
  <g fill="none" class="outline thin">
    <path d="M 100 160 l 0 -28 M 100 146 l -14 0 l 28 0"/>
    <path d="M 430 250 l 0 -24 M 430 238 l -12 0 l 24 0"/>
    <path d="M 425 520 q -14 12 -32 14"/>
  </g>
</svg>
